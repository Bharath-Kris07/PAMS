{% extends "base.html" %}

{% block title %}Add Medical Record - Haven Flow{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-8">
    <div>
        <nav class="flex items-center gap-2 text-xs text-on-surface-variant mb-2">
            <a href="{{ url_for('medical_dashboard') }}" class="hover:text-primary cursor-pointer">Medical Records</a>
            <span class="material-symbols-outlined text-[10px]">chevron_right</span>
            <span class="text-primary font-semibold">New Entry</span>
        </nav>
        <h1 class="text-3xl font-bold font-headline text-on-surface tracking-tight">Add Medical Record</h1>
    </div>
</div>

<div class="max-w-2xl bg-surface-container-lowest rounded-xl shadow-sm p-8 border-l-4 border-primary">
    <form action="{{ url_for('add_medical_record') }}" method="POST">
        <!-- Pre-fill animal_id if provided via URL -->
        {% set prefilled_id = request.args.get('animal_id', '') %}

        <div class="space-y-6">
            
            <div class="grid grid-cols-3 gap-6 items-center">
                <label for="animal_id" class="text-sm font-bold text-on-surface-variant text-right tracking-wide">Animal ID</label>
                <div class="col-span-2">
                    <select id="animal_id" name="animal_id" required class="w-full px-4 py-2.5 bg-surface-container-lowest border border-outline-variant/20 focus:border-primary/20 rounded focus:ring-2 focus:ring-primary/10 text-sm focus:outline-none transition-all">
                        <option value="" disabled selected>Select an Animal...</option>
                        {% for a in animals %}
                            <option value="{{ a.animal_id }}" {% if prefilled_id|int == a.animal_id %}selected{% endif %}>ANM-{{ a.animal_id }} : {{ a.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-6 items-center">
                <label for="treatment" class="text-sm font-bold text-on-surface-variant text-right tracking-wide">Treatment Name</label>
                <div class="col-span-2">
                    <input type="text" id="treatment" name="treatment" required placeholder="e.g. Rabies Vaccination, Deworming" class="w-full px-4 py-2.5 bg-surface-container-lowest border border-outline-variant/20 focus:border-primary/20 rounded focus:ring-2 focus:ring-primary/10 text-sm focus:outline-none transition-all">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-6 items-center">
                <label for="treatment_date" class="text-sm font-bold text-on-surface-variant text-right tracking-wide">Date of Treatment</label>
                <div class="col-span-2">
                    <input type="date" id="treatment_date" name="treatment_date" required class="w-full px-4 py-2.5 bg-surface-container-lowest border border-outline-variant/20 focus:border-primary/20 rounded focus:ring-2 focus:ring-primary/10 text-sm focus:outline-none transition-all text-on-surface-variant">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-6 items-start pt-2">
                <label for="notes" class="text-sm font-bold text-on-surface-variant text-right tracking-wide mt-3">Clinical Notes</label>
                <div class="col-span-2">
                    <textarea id="notes" name="notes" rows="4" placeholder="Enter details about the procedure, side effects, or recovery instructions..." class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant/20 focus:border-primary/20 rounded focus:ring-2 focus:ring-primary/10 text-sm focus:outline-none transition-all resize-none"></textarea>
                </div>
            </div>

        </div>

        <div class="mt-8 pt-6 border-t border-surface-container-low flex justify-end gap-3">
            <a href="{{ url_for('medical_dashboard') }}" class="px-6 py-2.5 bg-surface-container-high text-on-primary-container font-bold rounded-xl text-sm hover:bg-surface-container-high/80 transition-colors">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-primary to-primary-dim text-on-primary font-bold rounded-xl text-sm hover:shadow-md active:scale-95 transition-all">Log Treatment</button>
        </div>
    </form>
</div>
{% endblock %}
