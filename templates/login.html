{% extends "base.html" %}

{% block title %}Login - Haven Flow{% endblock %}

{% block content %}
<div class="w-full max-w-md p-8 bg-white rounded-xl shadow-md mx-auto mt-20 border border-gray-200">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold font-headline text-blue-800 tracking-tight">Haven Flow</h1>
        <p class="text-sm text-gray-500 mt-2">Sign in to manage operations</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
        <div>
            <label for="staff_id" class="block text-sm font-semibold text-gray-900 mb-2 font-label">Staff ID</label>
            <input type="number" id="staff_id" name="staff_id" required
                   class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400 outline-none" 
                   placeholder="Enter your numeric Staff ID">
        </div>
        <button type="submit" class="w-full py-3 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
